resources:
  jobs:
    budget_allocator_start:
      name: budget-allocator-start
      tasks:
        - task_key: start_app
          notebook_task:
            notebook_path: ../jobs/manage_app.py
            base_parameters:
              action: start
              app_name: budget-allocator
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"
      schedule:
        quartz_cron_expression: "0 0 8 ? * MON-FRI"
        timezone_id: America/Chicago
        pause_status: UNPAUSED
      tags:
        project: budget-allocator
        purpose: app-scheduler

    budget_allocator_stop:
      name: budget-allocator-stop
      tasks:
        - task_key: stop_app
          notebook_task:
            notebook_path: ../jobs/manage_app.py
            base_parameters:
              action: stop
              app_name: budget-allocator
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"
      schedule:
        quartz_cron_expression: "0 0 19 ? * MON-FRI"
        timezone_id: America/Chicago
        pause_status: UNPAUSED
      tags:
        project: budget-allocator
        purpose: app-scheduler
